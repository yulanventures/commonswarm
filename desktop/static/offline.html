<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CommonSwarm</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111317;
        color: #e4e6eb;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      }
      main {
        width: min(360px, calc(100vw - 48px));
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 1px solid #383d47;
        border-radius: 8px;
        background: #e4e6eb;
        color: #111317;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 9px 18px;
        cursor: pointer;
      }
      button:hover {
        background: #d4d7de;
      }
      button:focus-visible {
        outline: 2px solid #e4e6eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CommonSwarm</h1>
      <p>CommonSwarm could not be reached.</p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const target = params.get("target") || "https://commonswarm.com/app";
      document.getElementById("retry")?.addEventListener("click", () => {
        window.location.href = target;
      });
    </script>
  </body>
</html>

}

const apScreen = document.getElementById('screen-approval-refusal');
mountOrgDialogsController(apScreen, {
 approvals: [APPROVAL],
 refusals: [REFUSAL],
 onAction: () => ({ ok: true, decided_by: 'u-owner', decided_at: '2026-10-20T12:05:00Z' }),
});

function setScreen(scr) {
 for (const k of ['members', 'workspace-move-logo', 'private-channel', 'approval-refusal']) {
  const el = document.getElementById('screen-' + k);
  if (el) el.hidden = k !== scr;
 }
 document.querySelectorAll('.specimen-tabs [data-scr]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scr === scr)));
}
document.querySelector('.specimen-tabs').addEventListener('click', (e) => {
 const b = e.target.closest('[data-scr]');
 if (b) setScreen(b.dataset.scr);
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h) setScreen(h); });
if (location.hash.slice(1)) setScreen(location.hash.slice(1));
window.__slice5Ctrl = ctrl;
</script>

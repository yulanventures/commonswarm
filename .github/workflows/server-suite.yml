# Release PR means a pull_request whose base branch is release.
# Nightly 03:23 UTC and the Mac dispatch remain until Root verifies the separate
# pe-ci-1 systemd timer (deploy/ci/README.md). Remove this schedule only at cutover.
# Release PRs and manual suite selection remain after cutover.
# Full suite: server (including MCP auth), p1-cli, site, box-dry-run, and npm test (unit).
# server-repeat remains a manual diagnostic; it is not part of the full-suite matrix.
# Keep ubuntu-latest: these suites need Linux containers, headless browsers, or root fixtures.
# No production secrets or deploys. The local stack generates its own development keys.
# Manual ref is used only as a checkout ref; suite is a fixed choice.
name: server suite

on:
  pull_request:
    branches: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to test"
        required: true
        type: string
      suite:
        description: "Which suite to run"
        required: true
        type: choice
        options:
          - server
          - server-repeat
          - p1-cli
          - site
          - box-dry-run
          - unit
        default: server
      repeat_file:
        description: "Server test file to repeat"
        required: false
        type: string
        default: tests/p1-server/command.test.ts
      repeat_pattern:
        description: "--test-name-pattern for the server test to repeat"
        required: false
        type: string
        default: ""
      repeat_count:
        description: "Number of repeat iterations (1 to 200)"
        required: false
        type: string
        default: "50"

concurrency:
  group: server-suite-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.suite) || '["server","p1-cli","site","box-dry-run","unit"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        if: matrix.suite == 'server' || matrix.suite == 'p1-cli' || matrix.suite == 'unit'
        with:
          deno-version: v2.x
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        if: matrix.suite == 'server-repeat'
        with:
          deno-version: v2.x
      - run: npm ci
      # P0: measured official Caddy release + publisher checksum in; verified binary out.
      # Invariant: both Caddy gates fail closed; no latest/custom-build fallback.
      - name: Install box-matched Caddy for server and unit
        if: matrix.suite == 'server' || matrix.suite == 'unit'
        env:
          # Official publisher SHA-512 independently confirmed by HezLead on 2026-10-12.
          CADDY_ARCHIVE_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          set -euo pipefail
          caddy_stage=$(mktemp -d "$RUNNER_TEMP/caddy.XXXXXX")
          archive=caddy_2.11.4_linux_amd64.tar.gz
          publisher=https://github.com/caddyserver/caddy/releases/download/v2.11.4
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location "$publisher/$archive" -o "$caddy_stage/$archive"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location "$publisher/caddy_2.11.4_checksums.txt" -o "$caddy_stage/checksums.txt"
          publisher_sha=$(awk -v name="$archive" '$2 == name { print $1; count++ } END { if (count != 1) exit 1 }' "$caddy_stage/checksums.txt")
          [[ "$publisher_sha" =~ ^[0-9a-f]{128}$ ]]
          printf '%s  %s\n' "$publisher_sha" "$caddy_stage/$archive" | sha512sum --check --status
          echo "Caddy v2.11.4 linux amd64 publisher/archive SHA-512: $publisher_sha"
          test "$publisher_sha" = "$CADDY_ARCHIVE_SHA512"
          tar -xzf "$caddy_stage/$archive" -C "$caddy_stage" caddy
          test "$("$caddy_stage/caddy" version)" = 'v2.11.4 h1:XKxkMTgNSizEvKG6QHue6cAsFOteU2qA61w2tKkCWi0='
          sudo install -m 0755 "$caddy_stage/caddy" /usr/local/bin/caddy
          echo C1_CADDY_BINARY=/usr/local/bin/caddy >> "$GITHUB_ENV"
      - name: Build the MCP auth management bundle
        # The generated bundle is gitignored; any suite that can reach services/mcp-auth needs it first.
        if: matrix.suite == 'server' || matrix.suite == 'p1-cli' || matrix.suite == 'unit'
        run: |
          set -euo pipefail
          if [ "${{ matrix.suite }}" = server ]; then
            npm ci --prefix services/mcp-auth --ignore-scripts --no-audit --no-fund
          fi
          node services/mcp-auth/build-management.mjs
      - name: Guard and run the box whole-block dry run
        if: matrix.suite == 'box-dry-run'
        env:
          BOX_DRY_RUN: "1"
          BOX_DRY_RUN_PART: box
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$CI" = true
          sudo --preserve-env=BOX_DRY_RUN,BOX_DRY_RUN_PART,GITHUB_ACTIONS,CI \
            /bin/bash tests/box-dry-run/guard.sh
          for user in commonswarm caddy ops; do
            id -u "$user" >/dev/null 2>&1 || sudo useradd --no-create-home --shell /usr/sbin/nologin "$user"
          done
          set -o pipefail
          sudo --preserve-env=BOX_DRY_RUN,BOX_DRY_RUN_PART,GITHUB_ACTIONS,CI \
            "$(command -v npm)" run test:box-dry-run 2>&1 | tee box-dry-run.log
      - uses: supabase/setup-cli@v1
        if: matrix.suite == 'server'
        with:
          version: 2.118.0
      - uses: supabase/setup-cli@v1
        if: matrix.suite == 'server-repeat'
        with:
          version: 2.118.0
      - name: Read the pinned edge-runtime image
        if: matrix.suite == 'server' || matrix.suite == 'server-repeat'
        id: edge-runtime-image
        run: node --import tsx scripts/ci-edge-runtime-image.mjs metadata >> "$GITHUB_OUTPUT"
      - name: Cache the pinned edge-runtime image
        if: matrix.suite == 'server' || matrix.suite == 'server-repeat'
        id: edge-runtime-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/edge-runtime-image.tar
          key: ${{ runner.os }}-${{ runner.arch }}-edge-runtime-v1-${{ steps.edge-runtime-image.outputs.key }}
      - name: Prepare the pinned edge-runtime image
        if: matrix.suite == 'server' || matrix.suite == 'server-repeat'
        env:
          EDGE_RUNTIME_IMAGE: ${{ steps.edge-runtime-image.outputs.image }}
          EDGE_RUNTIME_CACHE: ${{ runner.temp }}/edge-runtime-image.tar
          EDGE_RUNTIME_CACHE_HIT: ${{ steps.edge-runtime-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          cache_needs_save=true
          if [ "$EDGE_RUNTIME_CACHE_HIT" = true ]; then
            if docker load --input "$EDGE_RUNTIME_CACHE" && docker image inspect "$EDGE_RUNTIME_IMAGE" >/dev/null 2>&1; then
              cache_needs_save=false
            else
              echo "Warning: Cached edge-runtime image could not be restored; preparing the pinned image."
            fi
          fi
          node --import tsx scripts/ci-edge-runtime-image.mjs ensure
          if [ "$cache_needs_save" = true ]; then
            docker save --output "$EDGE_RUNTIME_CACHE" "$EDGE_RUNTIME_IMAGE"
          fi
      - name: Start the local stack
        if: matrix.suite == 'server' || matrix.suite == 'server-repeat'
        # The box migrates as supabase_admin (deploy/supabase-stack/migrate/lib.sh).
        # Migrating as postgres made GRANTs on auth.* silent no-ops in run 38302463345.
        # CLI 2.118.0 env flags override root config values for this startup only.
        # PostgREST may be unhealthy until the deferred migrations create swarm_read.
        env:
          SUPABASE_DB_MIGRATIONS_ENABLED: "false"
          SUPABASE_DB_SEED_ENABLED: "false"
        run: |
          set -euo pipefail
          supabase start --ignore-health-check >/dev/null
      - name: Apply migrations as the box superuser
        if: matrix.suite == 'server' || matrix.suite == 'server-repeat'
        run: |
          set -euo pipefail
          # Read only the local fixture password; never put it in a URL or GITHUB_ENV.
          PGPASSWORD=$(supabase status -o json | python3 -c 'import json, sys; from urllib.parse import urlsplit, unquote; u = urlsplit(json.load(sys.stdin)["DB_URL"]); assert (u.hostname, u.port, u.username, u.path) == ("127.0.0.1", 54322, "postgres", "/postgres"); assert u.password; print(unquote(u.password))')
          export PGPASSWORD
          test "$(psql -X -v ON_ERROR_STOP=1 -At --dbname postgresql://supabase_admin@127.0.0.1:54322/postgres --command "SELECT current_user, session_user, rolsuper FROM pg_roles WHERE rolname = current_user")" = 'supabase_admin|supabase_admin|t'
          # CI differs from the box here ON PURPOSE. The box migrates as supabase_admin
          # under that role's default search_path ("$user", public, auth, extensions;
          # see docs/evidence/2026-09-28-release-9fa4217da9f6/20260928000003-diagnostic-row.txt).
          # 20260905000010 ran on hosted Supabase as postgres, whose path had no auth, so
          # its pg_get_viewdef self-check expects "auth.uid()". With auth on the path the
          # text prints "uid()" and the check raises (run 38311299225). Pin the PG default
          # "$user", public so that check passes; the CLI 2.118.0 migrate path (node-postgres)
          # honours PGOPTIONS, a Go-path CLI would not.
          # Scope PGOPTIONS to migration up; seeding/tests keep their normal paths.
          PGOPTIONS='-c search_path="$user",public' supabase migration up --db-url postgresql://supabase_admin@127.0.0.1:54322/postgres
          # Box PG 17.6, HezLead read-only check 2026-10-12: postgres is a member of
          # swarm_admin, swarm_command, swarm_read, swarm_capability; each row has
          # admin_option=true, inherit_option=true, set_option=true. Match CI explicitly.
          # PG16+ role options: https://www.postgresql.org/docs/17/sql-grant.html
          psql -X -v ON_ERROR_STOP=1 --dbname postgresql://supabase_admin@127.0.0.1:54322/postgres --command 'GRANT swarm_admin, swarm_command, swarm_read, swarm_capability TO postgres WITH ADMIN OPTION, INHERIT TRUE, SET TRUE'
          # Seeding and application tests still use their normal roles.
          psql -X -v ON_ERROR_STOP=1 --dbname postgresql://postgres@127.0.0.1:54322/postgres --file supabase/seed.sql
          psql -X -v ON_ERROR_STOP=1 --dbname postgresql://supabase_admin@127.0.0.1:54322/postgres --command "NOTIFY pgrst, 'reload schema'"
      - name: Check migration ledger and normal connection role
        if: matrix.suite == 'server' || matrix.suite == 'server-repeat'
        run: |
          set -euo pipefail
          PGPASSWORD=$(supabase status -o json | python3 -c 'import json, sys; from urllib.parse import urlsplit, unquote; u = urlsplit(json.load(sys.stdin)["DB_URL"]); assert (u.hostname, u.port, u.username, u.path) == ("127.0.0.1", 54322, "postgres", "/postgres"); assert u.password; print(unquote(u.password))')
          export PGPASSWORD
          printf '%s\n' supabase/migrations/*.sql | sed -E 's|.*/([0-9]+)_([^/]+)\.sql$|\1\|\2|' | LC_ALL=C sort > "$RUNNER_TEMP/expected-migrations"
          # The ledger is CLI metadata owned by the migrating role, not a test connection.
          test "$(psql -X -v ON_ERROR_STOP=1 -At --dbname postgresql://supabase_admin@127.0.0.1:54322/postgres --command "SELECT pg_get_userbyid(relowner) FROM pg_class WHERE oid = 'supabase_migrations.schema_migrations'::regclass")" = supabase_admin
          psql -X -v ON_ERROR_STOP=1 -At --dbname postgresql://supabase_admin@127.0.0.1:54322/postgres --command 'SELECT version, name FROM supabase_migrations.schema_migrations ORDER BY version, name' > "$RUNNER_TEMP/actual-migrations"
          diff -u "$RUNNER_TEMP/expected-migrations" "$RUNNER_TEMP/actual-migrations"
          test "$(psql -X -v ON_ERROR_STOP=1 -At --dbname postgresql://postgres@127.0.0.1:54322/postgres --command "SELECT current_user, session_user, NOT rolsuper, (SELECT count(*) = 4 AND count(DISTINCT roleid) = 4 AND bool_and(admin_option AND inherit_option AND set_option) FROM pg_auth_members WHERE member = 'postgres'::regrole AND roleid IN ('swarm_admin'::regrole, 'swarm_command'::regrole, 'swarm_read'::regrole, 'swarm_capability'::regrole)) FROM pg_roles WHERE rolname = current_user")" = 'postgres|postgres|t|t'
          echo "Migration versions/names match $(wc -l < "$RUNNER_TEMP/expected-migrations") files; supabase_admin owns the ledger; postgres is non-superuser with ADMIN, INHERIT, SET true on each of four swarm memberships."
      - name: Server suite
        if: matrix.suite == 'server'
        run: |
          set -o pipefail
          npm run test:p1-server 2>&1 | tee server.log
      - name: Repeat one server test
        if: matrix.suite == 'server-repeat'
        env:
          REPEAT_FILE: ${{ inputs.repeat_file }}
          REPEAT_PATTERN: ${{ inputs.repeat_pattern }}
          REPEAT_COUNT: ${{ inputs.repeat_count }}
        run: |
          set -o pipefail
          if [[ ! "$REPEAT_COUNT" =~ ^([1-9]|[1-9][0-9]|1[0-9]{2}|200)$ ]]; then
            echo "repeat_count must be an integer from 1 to 200" >&2
            exit 2
          fi
          resolved_tests_dir="$(realpath tests/p1-server)" || exit 2
          resolved_repeat_file="$(realpath "$REPEAT_FILE")" || {
            echo "repeat_file must be an existing .test.ts file under tests/p1-server/" >&2
            exit 2
          }
          if [[ -L "$REPEAT_FILE" || ! -f "$resolved_repeat_file" || -L "$resolved_repeat_file" || "$resolved_repeat_file" != "$resolved_tests_dir/"*.test.ts ]]; then
            echo "repeat_file must be an existing .test.ts file under tests/p1-server/" >&2
            exit 2
          fi
          REPEAT_FILE="$resolved_repeat_file"
          npm run build:command-core || exit 1
          pass=0
          fail=0
          no_tests=0
          executed_subtests_total=0
          : > server-repeat.log
          for iteration in $(seq 1 "$REPEAT_COUNT"); do
            iteration_log="$RUNNER_TEMP/server-repeat-${iteration}.log"
            if [ -n "$REPEAT_PATTERN" ]; then
              node_command=(node --import tsx --test --test-concurrency=1 --test-name-pattern "$REPEAT_PATTERN" "$REPEAT_FILE")
            else
              node_command=(node --import tsx --test --test-concurrency=1 "$REPEAT_FILE")
            fi
            runner_status=0
            "${node_command[@]}" >"$iteration_log" 2>&1 || runner_status=$?
            executed_subtests="$(bash tests/server-repeat-count.sh <"$iteration_log")"
            executed_subtests_total=$((executed_subtests_total + executed_subtests))
            echo "REPEAT iteration=$iteration executed-subtests=$executed_subtests status=$runner_status" | tee -a server-repeat.log
            if [ "$runner_status" -eq 0 ] && [ "$executed_subtests" -gt 0 ]; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              failure_reason=""
              if [ "$executed_subtests" -eq 0 ]; then
                no_tests=$((no_tests + 1))
                failure_reason="REPEAT failure reason=no-tests-run"
              fi
              {
                echo "REPEAT failure iteration=$iteration"
                if [ -n "$failure_reason" ]; then
                  echo "$failure_reason"
                fi
                sed -n '1,40p' "$iteration_log"
              } | tee -a server-repeat.log
            fi
            cat "$iteration_log" >> server-repeat.log
          done
          total=$((pass + fail))
          echo "REPEAT pass=$pass fail=$fail no-tests=$no_tests total=$total executed-subtests-total=$executed_subtests_total" | tee -a server-repeat.log
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
      - name: MCP auth suite
        if: ${{ !cancelled() && matrix.suite == 'server' }}
        run: |
          set -euo pipefail
          # Entrypoint fixtures use the macOS temporary root; Ubuntu lacks its parent.
          # This only creates a sticky shared temp directory on the ephemeral runner.
          sudo install -d -m 1777 /private/tmp
          npm ci --prefix services/mcp-auth --ignore-scripts --no-audit --no-fund 2>&1 | tee -a server.log
          node services/mcp-auth/build-management.mjs 2>&1 | tee -a server.log
          npm --prefix services/mcp-auth test 2>&1 | tee -a server.log
          npm --prefix services/mcp-auth run test:postgres 2>&1 | tee -a server.log
      - name: C1 W2 rehearsal (PostgreSQL 17)
        if: ${{ !cancelled() && matrix.suite == 'server' }}
        run: |
          set -euo pipefail
          # PGDG PostgreSQL 17 binaries only; no main cluster, so nothing listens on a TCP port.
          sudo install -d /etc/postgresql-common
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get update -q 2>&1 | tee -a server.log
          sudo apt-get install -y -q postgresql-common 2>&1 | tee -a server.log
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y 2>&1 | tee -a server.log
          sudo apt-get install -y -q postgresql-17 2>&1 | tee -a server.log
          RUN_PG_REHEARSAL=1 PG_BIN=/usr/lib/postgresql/17/bin node --import tsx --test tests/c1-w2-rehearsal.test.ts 2>&1 | tee -a server.log
      - name: C1 docker stdin check (plan ai_db shape, postgres:17)
        if: ${{ !cancelled() && matrix.suite == 'server' }}
        run: |
          set -euo pipefail
          PG_BIN=/usr/lib/postgresql/17/bin C1_DOCKER_PSQL_IMAGE=postgres:17 bash scripts/c1-docker-stdin-check.sh 2>&1 | tee -a server.log
      - name: p1-cli suite
        if: matrix.suite == 'p1-cli'
        run: |
          set -o pipefail
          npm run test:p1-cli 2>&1 | tee p1-cli.log
      - name: Site build and site suite
        if: matrix.suite == 'site'
        # Observers use only Playwright's bundled headless shell, after building the pages.
        env:
          RUN_BROWSER_TESTS: "1"
        run: |
          set -o pipefail
          npm ci --prefix site
          cd site
          npx --yes playwright@1.63.0 install --with-deps chromium-headless-shell
          cd ..
          npm --prefix site run build
          # Runner CHROME_BIN may name installed Chrome; discover the bundled shell instead.
          unset CHROME_BIN
          npm --prefix site run test:ci 2>&1 | tee site.log
      - name: Service-free test suite
        if: matrix.suite == 'unit'
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-log
          path: ${{ matrix.suite }}.log
          retention-days: 14

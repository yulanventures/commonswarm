# Runs the local-stack server suite (`npm run test:p1-server`) for one ref, on demand only.
#
# Why it exists (HezLead ruling, 2026-09-26): the Mac mini can no longer host a local Supabase stack (OrbStack was
# stopped for memory), and no lane ships with an unrun server suite, so lane server suites run here.
#
# Limits, all deliberate:
# - workflow_dispatch ONLY. Never on push, pull_request or schedule: each run costs paid minutes.
# - GitHub-hosted ubuntu-latest ONLY. It does not read the CI_RUNS_ON* repository variables the other workflows use,
#   because those route to the self-hosted fleet on machines that cannot spare a Supabase stack's memory.
# - No secrets. The local stack generates its own development keys.
# - timeout-minutes 30; one run per landing SHA; at most 20 dispatches a week (about $2.50).
# The ref input is used only as a checkout ref, never inside a run script.
name: server suite (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to test"
        required: true
        type: string

concurrency:
  group: server-suite-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  p1-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start the local stack
        # A fresh volume has no swarm_read schema until db reset runs, so PostgREST fails its first health check.
        run: |
          supabase start --ignore-health-check
          npm run db:reset
      - name: Server suite
        run: |
          set -o pipefail
          npm run test:p1-server 2>&1 | tee p1-server.log
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-server-log
          path: p1-server.log
          retention-days: 14

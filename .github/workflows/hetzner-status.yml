name: Hetzner receipt statuses
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      run_ids:
        description: 'Up to 20 comma-separated run IDs; empty reconciles ready receipts'
        required: false
        type: string
        default: ''
permissions:
  statuses: write
concurrency:
  group: commonswarm-hetzner-status
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'yulanventures/commonswarm' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, pe-ci-1, commonswarm-status]
    timeout-minutes: 5
    steps:
      - name: Reconcile installed reviewed publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, os, pathlib, pwd, socket, stat, sys
          if socket.gethostname().split('.')[0] != 'pe-ci-1':
              sys.exit('REFUSE: wrong CI host')
          if os.environ.get('GITHUB_REPOSITORY') != 'yulanventures/commonswarm' or os.environ.get('GITHUB_REF') != 'refs/heads/main':
              sys.exit('REFUSE: untrusted workflow source')
          if os.getuid() == 0 or os.getuid() != pwd.getpwnam('commonswarm-status').pw_uid:
              sys.exit('REFUSE: wrong runner user')
          path = pathlib.Path('/opt/commonswarm-ci/scripts/publish-status.py')
          for component in (*reversed(path.parents), path):
              info = component.lstat()
              if stat.S_ISLNK(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                  sys.exit('REFUSE: unsafe installed publisher')
          if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != '66606e33d6838ef8e0b69d8bb9514c7e71cb9e23315d78eec07949fab61ba415':
              sys.exit('REFUSE: publisher hash mismatch')
          os.execv(sys.executable, [sys.executable, '-I', str(path), '--run-ids', os.environ.pop('RUN_IDS', '')])
          PY

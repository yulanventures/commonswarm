name: File size ratchet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  file-size:
    name: file-size
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test size policy
        run: python3 -m unittest discover -s scripts -p 'test_file_size.py'
      - name: Check changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/check-file-size.py --base "$PR_BASE" --head "$HEAD_SHA" --merge-base
          else
            python3 scripts/check-file-size.py --base "$PUSH_BASE" --head "$HEAD_SHA"
          fi

# Checks app/ on pull requests, pushes to main, and manual workflow_dispatch.
# Runs typecheck, build, and tests in app/ when app/, shared/, or this workflow changes.
name: app

on:
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'
      - '.github/workflows/app.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Always a GitHub-hosted runner: this runs on pull requests, including from forks, and installs
    # packages, so it must never land on a self-hosted machine.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

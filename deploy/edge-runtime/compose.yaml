services:
  edge-runtime:
    image: public.ecr.aws/supabase/edge-runtime:v1.73.13
    entrypoint:
      - /bin/bash
      - /home/deno/deploy/bootstrap.sh
    command:
      - start
      - --main-service
      - /home/deno/main
      - --port
      - "9000"
      - --policy
      - per_worker
      - --max-parallelism
      - "6"
      - --request-read-timeout
      - "15000"
      - --request-wait-timeout
      - "10000"
      - --user-worker-request-idle-timeout
      - "65000"
      - --graceful-exit-timeout
      - "70"
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      # Compose can validate this file away from the box. The main service
      # still refuses to start when its required variables are missing.
      - path: /home/commonswarm/.env
        required: false
    volumes:
      - ./main:/home/deno/main:ro
      - ./bootstrap.sh:/home/deno/deploy/bootstrap.sh:ro
      - ./h0-deno.json:/home/deno/deploy/h0-deno.json:ro
      - ../../supabase/functions:/home/deno/functions-source:ro
      - ../../src:/var/src:ro
      - edge-runtime-cache:/root/.cache/deno
    mem_limit: 2g
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          IFS= read -r status <&3 && [[ "$${status}" == *' 200 '* ]]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  edge-runtime-cache:

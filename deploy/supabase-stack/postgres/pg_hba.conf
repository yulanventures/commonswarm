# CommonSwarm N-db: TLS and SCRAM on every local and network connection.
local     all          all                         scram-sha-256
hostnossl all          all          0.0.0.0/0      reject
hostnossl all          all          ::/0           reject

# HezLead's backup connects from the commonswarm-net bridge only.
hostssl   all          backup_ro    172.31.0.1/32  scram-sha-256
hostssl   all          backup_ro    0.0.0.0/0      reject
hostssl   all          backup_ro    ::/0           reject

# GoTrue, PostgREST, Realtime, Storage API, and edge-runtime use this subnet.
hostssl   all          all          172.31.0.0/24  scram-sha-256
hostssl   replication  all          172.31.0.0/24  scram-sha-256
hostssl   all          all          0.0.0.0/0      reject
hostssl   all          all          ::/0           reject

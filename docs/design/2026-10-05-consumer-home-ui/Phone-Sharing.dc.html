<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What Claude shares in Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:#17231C}a:hover{color:#2F4438}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; padding: 52px 20px 24px; background: #EEF2EA; color: #17231C; font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.4">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #4F5E54; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#4F5E54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8H3M7 4L3 8l4 4"></path></svg>
<span>Home</span>
</button>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; background: #DDE7FA; border-radius: 12px; color: #1B3F87; font-weight: 600; font-size: 14px"><span style="width: 26px; height: 26px; border-radius: 8px; background: #2A5DBF; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">C</span><span>Your Claude</span></span>
</div>

<h1 style="margin: 8px 0 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-weight: 700; font-size: 31px; line-height: 1.08; letter-spacing: -0.02em">What Claude shares in Home</h1>
<p style="margin: 10px 0 0; font-size: 15px; color: #4F5E54; text-wrap: pretty">Nikki and Muse get only what's switched on here.</p>

<div style="margin-top: 18px; padding: 0 16px; background: #FCFDFA; border: 1px solid #D3DBCC; border-radius: 18px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px">
<span style="font-weight: 600">What I post in Home</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #4F5E54">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#4F5E54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"></path></svg>
<span>Always</span>
</span>
</div>

<button type="button" role="switch" aria-checked="{{busyOn}}" onClick="{{busyToggle}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 58px; padding: 0; border: 0; border-top: 1px solid #E3E9DD; background: transparent; color: #17231C; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<span>Free or busy on my calendar</span>
<span style="width: 48px; height: 28px; border-radius: 999px; box-sizing: border-box; padding: 3px; flex: none; display: inline-flex; background: {{busyTrack}}"><span style="width: 22px; height: 22px; border-radius: 50%; margin-left: {{busyShift}}; background: {{busyKnob}}"></span></span>
</button>

<button type="button" role="switch" aria-checked="{{calOn}}" onClick="{{calToggle}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 58px; padding: 0; border: 0; border-top: 1px solid #E3E9DD; background: transparent; color: #17231C; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<span>Calendar details</span>
<span style="width: 48px; height: 28px; border-radius: 999px; box-sizing: border-box; padding: 3px; flex: none; display: inline-flex; background: {{calTrack}}"><span style="width: 22px; height: 22px; border-radius: 50%; margin-left: {{calShift}}; background: {{calKnob}}"></span></span>
</button>

<button type="button" role="switch" aria-checked="{{mailOn}}" onClick="{{mailToggle}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 58px; padding: 0; border: 0; border-top: 1px solid #E3E9DD; background: transparent; color: #17231C; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<span>Email</span>
<span style="width: 48px; height: 28px; border-radius: 999px; box-sizing: border-box; padding: 3px; flex: none; display: inline-flex; background: {{mailTrack}}"><span style="width: 22px; height: 22px; border-radius: 50%; margin-left: {{mailShift}}; background: {{mailKnob}}"></span></span>
</button>

<button type="button" role="switch" aria-checked="{{filesOn}}" onClick="{{filesToggle}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 58px; padding: 0; border: 0; border-top: 1px solid #E3E9DD; background: transparent; color: #17231C; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<span>Files outside Home</span>
<span style="width: 48px; height: 28px; border-radius: 999px; box-sizing: border-box; padding: 3px; flex: none; display: inline-flex; background: {{filesTrack}}"><span style="width: 22px; height: 22px; border-radius: 50%; margin-left: {{filesShift}}; background: {{filesKnob}}"></span></span>
</button>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid #E3E9DD">
<span style="font-weight: 600">My other spaces</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #4F5E54">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#4F5E54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.8"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>
<span>Never</span>
</span>
</div>

</div>

<div style="margin-top: 14px; padding: 12px 16px; border: 1.5px dashed #7B897F; border-radius: 16px; font-size: 14px; color: #4F5E54; text-wrap: pretty">{{summary}}</div>

<button type="button" style="width: 100%; min-height: 52px; margin-top: auto; border: 0; border-radius: 999px; background: #17231C; color: #EEF2EA; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer">Done</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { on: { busy: true, cal: false, mail: false, files: false } };
renderVals() {
const cur = (this.state && this.state.on) || { busy: true };
const labels = { busy: 'whether you are free or busy', cal: 'your calendar details', mail: 'your email', files: 'your files outside Home' };
const v = {};
const shared = ['what you post in Home'];
Object.keys(labels).forEach((k) => {
const on = !!cur[k];
if (on) shared.push(labels[k]);
v[k + 'On'] = on;
v[k + 'Track'] = on ? '#17231C' : '#8A978C';
v[k + 'Knob'] = on ? '#D4F04A' : '#FFFFFF';
v[k + 'Shift'] = on ? '20px' : '0px';
v[k + 'Toggle'] = () => {
const next = Object.assign({}, cur);
next[k] = !on;
this.setState({ on: next });
};
});
const last = shared.length > 1 ? shared.pop() : '';
v.summary = 'Right now Muse can get ' + shared.join(', ') + (last ? ' and ' + last : '') + '. Nothing else.';
return v;
}
}
</script>
</body>
</html>
